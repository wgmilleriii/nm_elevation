<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Journey Dashboard - New Mexico Elevation</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .dashboard-header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .dashboard-header h1 {
            font-size: 2.5em;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: rgba(255,255,255,0.1);
            padding: 15px 25px;
            border-radius: 10px;
            text-align: center;
            color: white;
            backdrop-filter: blur(10px);
        }

        .stat-card .number {
            font-size: 2em;
            font-weight: bold;
            display: block;
        }

        .journey-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .journey-card {
            background: white;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .journey-card:hover {
            transform: translateY(-5px);
        }

        .session-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .session-number {
            font-weight: bold;
            color: #667eea;
            font-size: 1.1em;
        }

        .session-status {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-active { background: #4CAF50; color: white; }
        .status-completed { background: #2196F3; color: white; }
        .status-timeout { background: #FF9800; color: white; }

        .journey-svg {
            width: 100%;
            height: 180px;
            border: 2px solid #f0f0f0;
            border-radius: 8px;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #f8f9fa, #e9ecef);
        }

        .journey-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 0.8em;
        }

        .info-item {
            background: #f8f9fa;
            padding: 5px 8px;
            border-radius: 6px;
            text-align: center;
        }

        .info-label {
            font-weight: bold;
            color: #666;
            display: block;
        }

        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 15px 25px;
            cursor: pointer;
        }

        @media (max-width: 1200px) {
            .journey-grid { grid-template-columns: repeat(3, 1fr); }
        }

        @media (max-width: 768px) {
            .journey-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 480px) {
            .journey-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="dashboard-header">
        <h1>🗺️ GPS Journey Dashboard</h1>
        <p>Last 10 GPS Sessions - Real-time Journey Visualization</p>
    </div>

    <div class="stats-bar">
        <div class="stat-card">
            <span class="number" id="totalUsers">--</span>
            <span class="label">Users</span>
        </div>
        <div class="stat-card">
            <span class="number" id="totalSessions">--</span>
            <span class="label">Sessions</span>
        </div>
        <div class="stat-card">
            <span class="number" id="totalPoints">--</span>
            <span class="label">GPS Points</span>
        </div>
        <div class="stat-card">
            <span class="number" id="activeNow">--</span>
            <span class="label">Active Now</span>
        </div>
    </div>

    <div class="journey-grid" id="journeyGrid">
        <!-- Journey cards will be populated here -->
    </div>

    <button class="refresh-btn" onclick="refreshDashboard()">🔄 Refresh</button>

    <script>
        const API_BASE = './api';

        document.addEventListener('DOMContentLoaded', function() {
            loadDashboard();
            setInterval(loadDashboard, 30000); // Auto-refresh every 30s
        });

        async function loadDashboard() {
            await loadSystemStats();
            await loadJourneyData();
        }

        async function loadSystemStats() {
            try {
                const response = await fetch(API_BASE + '/stats');
                const stats = await response.json();
                
                document.getElementById('totalUsers').textContent = stats.totalUsers || 0;
                document.getElementById('totalSessions').textContent = stats.totalSessions || 0;
                document.getElementById('totalPoints').textContent = stats.totalPoints || 0;
                
                // Count active sessions from queue
                const queueResponse = await fetch(API_BASE + '/queue/status');
                const queueData = await queueResponse.json();
                const activeCount = queueData.status?.active_processors?.length || 0;
                document.getElementById('activeNow').textContent = activeCount;
                
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        async function loadJourneyData() {
            const grid = document.getElementById('journeyGrid');
            grid.innerHTML = ''; // Clear existing content

            try {
                // Get the last 10 sessions
                const sessions = await getLastSessions(10);
                
                if (sessions.length === 0) {
                    grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: white;">No GPS sessions found</div>';
                    return;
                }

                // Create journey cards
                for (const session of sessions) {
                    const card = await createJourneyCard(session);
                    grid.appendChild(card);
                }

            } catch (error) {
                console.error('Error loading journey data:', error);
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #ff6b6b;">Error loading journey data</div>';
            }
        }

        async function getLastSessions(count) {
            const sessions = [];
            
            // Try session numbers from high to low to find recent ones
            for (let i = 100; i >= 1 && sessions.length < count; i--) {
                try {
                    const response = await fetch(API_BASE + '/session/lookup?number=' + i);
                    const data = await response.json();
                    
                    if (data.found) {
                        sessions.push({
                            number: i,
                            created: data.session.created,
                            sessionId: data.session.sessionId || 'session_' + i,
                            userId: data.session.userId || 'unknown'
                        });
                    }
                } catch (error) {
                    // Session doesn't exist, continue
                }
            }
            
            return sessions.sort((a, b) => b.number - a.number);
        }

        async function createJourneyCard(session) {
            const card = document.createElement('div');
            card.className = 'journey-card';
            
            // Try to get session details
            let sessionData = null;
            let gpsPoints = [];
            
            try {
                if (session.userId && session.userId !== 'unknown') {
                    const userResponse = await fetch(API_BASE + '/user-sessions?userId=' + session.userId);
                    const userData = await userResponse.json();
                    sessionData = userData.sessions?.find(s => s.globalNumber === session.number);
                    
                    if (sessionData) {
                        const pointsResponse = await fetch(API_BASE + '/user/points?userId=' + session.userId);
                        const pointsData = await pointsResponse.json();
                        gpsPoints = pointsData.points?.filter(p => p.sessionId === sessionData.sessionId) || [];
                    }
                }
            } catch (error) {
                console.log('Error getting session details:', error);
            }

            const pointCount = gpsPoints.length;
            const status = sessionData?.status || 'unknown';
            const duration = sessionData ? calculateDuration(sessionData.startTime, sessionData.endTime) : '--';

            card.innerHTML = 
                '<div class="session-header">' +
                    '<span class="session-number">Session #' + session.number + '</span>' +
                    '<span class="session-status status-' + status + '">' + status + '</span>' +
                '</div>' +
                '<div class="journey-svg" id="svg-' + session.number + '"></div>' +
                '<div class="journey-info">' +
                    '<div class="info-item">' +
                        '<span class="info-label">Points</span>' +
                        '<span class="info-value">' + pointCount + '</span>' +
                    '</div>' +
                    '<div class="info-item">' +
                        '<span class="info-label">Duration</span>' +
                        '<span class="info-value">' + duration + '</span>' +
                    '</div>' +
                    '<div class="info-item">' +
                        '<span class="info-label">Created</span>' +
                        '<span class="info-value">' + formatTime(session.created) + '</span>' +
                    '</div>' +
                    '<div class="info-item">' +
                        '<span class="info-label">User</span>' +
                        '<span class="info-value">' + (session.userId ? session.userId.substring(5, 11) : 'Unknown') + '</span>' +
                    '</div>' +
                '</div>';

            // Create SVG journey visualization after a short delay
            setTimeout(() => {
                createJourneySVG('svg-' + session.number, gpsPoints);
            }, 100);

            return card;
        }

        function createJourneySVG(containerId, points) {
            const container = document.getElementById(containerId);
            if (!container || !points || points.length < 2) {
                container.innerHTML = '<div style="display: flex; align-items: center; justify-content: center; height: 100%; color: #999;">No route data</div>';
                return;
            }

            // Calculate bounds
            const lats = points.map(p => p.lat);
            const lons = points.map(p => p.lon);
            const minLat = Math.min(...lats);
            const maxLat = Math.max(...lats);
            const minLon = Math.min(...lons);
            const maxLon = Math.max(...lons);

            const latRange = maxLat - minLat || 0.001;
            const lonRange = maxLon - minLon || 0.001;
            const padding = 0.1;

            const width = container.offsetWidth - 4;
            const height = container.offsetHeight - 4;

            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('width', width);
            svg.setAttribute('height', height);

            function gpsToSVG(lat, lon) {
                const x = ((lon - minLon) / lonRange) * width * (1 - 2 * padding) + width * padding;
                const y = height - (((lat - minLat) / latRange) * height * (1 - 2 * padding) + height * padding);
                return { x, y };
            }

            // Create path
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            let pathData = '';

            points.forEach((point, index) => {
                const { x, y } = gpsToSVG(point.lat, point.lon);
                if (index === 0) {
                    pathData += 'M ' + x + ' ' + y;
                } else {
                    pathData += ' L ' + x + ' ' + y;
                }
            });

            path.setAttribute('d', pathData);
            path.setAttribute('stroke', '#667eea');
            path.setAttribute('stroke-width', '2');
            path.setAttribute('fill', 'none');
            path.setAttribute('stroke-linecap', 'round');
            svg.appendChild(path);

            // Add start marker (green)
            const startPoint = gpsToSVG(points[0].lat, points[0].lon);
            const startMarker = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            startMarker.setAttribute('cx', startPoint.x);
            startMarker.setAttribute('cy', startPoint.y);
            startMarker.setAttribute('r', '4');
            startMarker.setAttribute('fill', '#4CAF50');
            startMarker.setAttribute('stroke', 'white');
            startMarker.setAttribute('stroke-width', '2');
            svg.appendChild(startMarker);

            // Add end marker (red)
            if (points.length > 1) {
                const endPoint = gpsToSVG(points[points.length - 1].lat, points[points.length - 1].lon);
                const endMarker = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                endMarker.setAttribute('cx', endPoint.x);
                endMarker.setAttribute('cy', endPoint.y);
                endMarker.setAttribute('r', '4');
                endMarker.setAttribute('fill', '#F44336');
                endMarker.setAttribute('stroke', 'white');
                endMarker.setAttribute('stroke-width', '2');
                svg.appendChild(endMarker);
            }

            container.innerHTML = '';
            container.appendChild(svg);
        }

        function calculateDuration(startTime, endTime) {
            if (!startTime) return '--';
            
            const start = new Date(startTime);
            const end = endTime ? new Date(endTime) : new Date();
            const duration = end - start;
            
            const minutes = Math.floor(duration / 60000);
            const seconds = Math.floor((duration % 60000) / 1000);
            
            if (minutes > 0) {
                return minutes + 'm ' + seconds + 's';
            } else {
                return seconds + 's';
            }
        }

        function formatTime(timestamp) {
            return new Date(timestamp).toLocaleTimeString([], { 
                hour: '2-digit', 
                minute: '2-digit' 
            });
        }

        function refreshDashboard() {
            const btn = document.querySelector('.refresh-btn');
            btn.style.transform = 'rotate(360deg)';
            btn.style.transition = 'transform 1s';
            
            loadDashboard().finally(() => {
                setTimeout(() => {
                    btn.style.transform = 'rotate(0deg)';
                }, 1000);
            });
        }
    </script>
</body>
</html>
